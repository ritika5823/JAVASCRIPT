<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Data</title>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 90%;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #fetchBtn {
            background-color: #2563eb;
            color: white;
        }

        #jqueryBtn {
            background-color: #16a34a;
            color: white;
        }

        .buttons {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Data</h1>

        <div class="buttons">
            <button id="fetchBtn">Load using fetch()</button>

            <button id="jqueryBtn">
                Load using $.getJSON()
            </button>
        </div>

        <p id="message">
            Click any button to load student data.
        </p>

        <table>

            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Year</th>
                    <th>Email</th>
                    <th>Marks</th>
                </tr>
            </thead>

            <tbody id="studentTable">
                <!-- Student data will be added here -->
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
