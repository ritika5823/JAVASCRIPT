<!DOCTYPE html>
<html>
<head>
    <title>Class Timer</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 40px;
        }

        .box {
            background: white;
            color: black;
            max-width: 600px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
        }

        input {
            padding: 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #667eea;
            color: white;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.8;
        }

        #timer {
            font-size: 55px;
            font-weight: bold;
            margin: 30px;
        }

        .class-item {
            background: #f2f2f2;
            color: black;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Class Timer</h1>

        <input
            type="text"
            id="className"
            placeholder="Class Name"
        >

        <br>

        <input
            type="number"
            id="minutes"
            placeholder="Minutes"
            min="0"
        >

        <input
            type="number"
            id="seconds"
            placeholder="Seconds"
            min="0"
            max="59"
        >

        <br>

        <button id="addBtn">
            Add Timer
        </button>

        <h2 id="currentClass">
            No Timer Selected
        </h2>

        <div id="timer">
            00:00
        </div>

        <button id="startBtn">
            Start
        </button>

        <button id="pauseBtn">
            Pause
        </button>

        <button id="resetBtn">
            Reset
        </button>

        <h2>My Timers</h2>

        <div id="timerList"></div>

    </div>


    <script type="module">

        import {
            addTimer,
            startTimer,
            pauseTimer,
            resetTimer,
            selectTimer
        } from "./timer.js";


        document.getElementById("addBtn")
            .addEventListener("click", addTimer);


        document.getElementById("startBtn")
            .addEventListener("click", startTimer);


        document.getElementById("pauseBtn")
            .addEventListener("click", pauseTimer);


        document.getElementById("resetBtn")
            .addEventListener("click", resetTimer);


        document.getElementById("timerList")
            .addEventListener("click", function(event) {

                if (event.target.classList.contains("select")) {

                    let index =
                        event.target.getAttribute("data-index");

                    selectTimer(Number(index));
                }

            });

    </script>

</body>
</html>
